            justify-content: center;

            font-size: 0.55rem;

<script>
    let timeLeft = 10;
    const secondsElement = document.getElementById('seconds');
    
    setInterval(() => {
        if (timeLeft <= 0) {
            timeLeft = 10;
        } else {
            timeLeft--;
        }
        secondsElement.textContent = timeLeft < 10 ? '0' + timeLeft : timeLeft;
    }, 1000);
